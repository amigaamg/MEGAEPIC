# Demo clinical cases for validating the reasoning engine
clinical_cases:
  # ── Chest Pain ──
  - case_id: case-chest-pain
    name: Chest Pain - Acute Coronary Syndrome
    patient_id: pat-adult
    symptoms: ["chest_pain", "dyspnea", "diaphoresis", "nausea"]
    history:
      - "Patient presents with acute onset central chest pain radiating to left arm, started 2 hours ago"
      - "Shortness of breath, nausea, diaphoresis"
      - "Risk factors: hypertension, smoker, family history of CAD"
    vitals:
      bp: "150/95"
      heart_rate: 105
      respiratory_rate: 22
      oxygen_saturation: 94
      temperature: 37.0
    exam_findings:
      - "Chest: clear, no crepitations"
      - "CVS: S1S2 heard, no murmurs, tachycardia"
      - "Abdomen: soft, non-tender"
    investigations:
      ecg: "ST elevation in V2-V4, II, III, aVF"
      troponin: "elevated (2.5 ng/mL)"
      cxr: "normal"
    expected_context: "acute_myocardial_infarction"
    expected_differentials:
      - "acute_myocardial_infarction"
      - "unstable_angina"
      - "pulmonary_embolism"
      - "aortic_dissection"
      - "pericarditis"
    expected_management:
      - "aspirin_300mg"
      - "clopidogrel_loading"
      - "nitroglycerin"
      - "morphine"
      - "oxygen"
      - "urgent_reperfusion"

  # ── Acute Abdomen ──
  - case_id: case-acute-abdomen
    name: Acute Abdomen - Appendicitis
    patient_id: pat-adult-male-healthy
    symptoms: ["abdominal_pain", "nausea", "vomiting", "fever", "anorexia"]
    history:
      - "24-year-old male with 2 days of periumbilical pain migrating to right lower quadrant"
      - "Nausea, 2 episodes of vomiting, anorexia"
      - "Low grade fever"
    vitals:
      bp: "120/80"
      heart_rate: 98
      respiratory_rate: 18
      oxygen_saturation: 98
      temperature: 38.2
    exam_findings:
      - "Abdomen: tenderness at McBurney's point, guarding, Rovsing's sign positive"
      - "Rebound tenderness positive"
      - "Psoas sign positive"
    investigations:
      wbc: "elevated (15,000)"
      crp: "elevated (85)"
      ultrasound: "non-compressible appendix 8mm"
    expected_context: "acute_appendicitis"
    expected_differentials:
      - "acute_appendicitis"
      - "mesenteric_adenitis"
      - "gastroenteritis"
      - "ectopic_pregnancy"
      - "renal_colic"
    expected_management:
      - "iv_fluids"
      - "antibiotics"
      - "analgesia"
      - "emergency_appendectomy"

  # ── Stroke ──
  - case_id: case-stroke
    name: Cerebrovascular Accident - Ischemic Stroke
    patient_id: pat-hypertension
    symptoms: ["facial_droop", "arm_weakness", "speech_difficulty", "acute_confusion"]
    history:
      - "60-year-old female with hypertension, sudden onset right-sided weakness and facial droop 1 hour ago"
      - "Unable to speak clearly, drooling"
      - "No history of diabetes, no anticoagulation"
    vitals:
      bp: "180/100"
      heart_rate: 88
      respiratory_rate: 20
      oxygen_saturation: 97
      temperature: 36.8
    exam_findings:
      - "Neuro: right-sided hemiplegia, facial droop, aphasia"
      - "NIHSS score: 14"
      - "CVS: irregularly irregular pulse - atrial fibrillation"
    investigations:
      ct_brain: "no hemorrhage, early ischemic changes in MCA territory"
      blood_glucose: "6.8"
      ecg: "atrial fibrillation"
    expected_context: "acute_ischemic_stroke"
    expected_differentials:
      - "acute_ischemic_stroke"
      - "intracerebral_hemorrhage"
      - "transient_ischemic_attack"
      - "hypoglycemia"
      - "seizure_with_todds_palsy"
    expected_management:
      - "thrombolysis_assessment"
      - "bp_management"
      - "aspirin_post_thrombolysis"
      - "swallow_assessment"
      - "stroke_unit_admission"

  # ── Diabetes DKA ──
  - case_id: case-dka
    name: Diabetic Ketoacidosis
    patient_id: pat-diabetes
    symptoms: ["polyuria", "polydipsia", "nausea", "vomiting", "abdominal_pain", "confusion"]
    history:
      - "55-year-old male with type 2 diabetes, stopped medication 3 days ago"
      - "Excessive thirst, frequent urination, nausea and vomiting for 24 hours"
      - "Abdominal pain, confusion"
    vitals:
      bp: "90/60"
      heart_rate: 115
      respiratory_rate: 28
      oxygen_saturation: 98
      temperature: 36.9
    exam_findings:
      - "General: dehydrated, Kussmaul breathing, ketotic breath"
      - "Abdomen: diffuse tenderness"
      - "Neuro: confused, GCS 14"
    investigations:
      blood_glucose: "28.5 mmol/L"
      ketones: "high (4+)"
      ph: "7.1"
      bicarbonate: "10"
      sodium: "132"
      potassium: "5.8"
      creatinine: "150"
    expected_context: "diabetic_ketoacidosis"
    expected_differentials:
      - "diabetic_ketoacidosis"
      - "hyperosmolar_hyperglycemic_state"
      - "acute_abdomen"
      - "sepsis"
    expected_management:
      - "iv_fluids"
      - "insulin_infusion"
      - "potassium_replacement"
      - "bicarbonate_if_severe"
      - "monitor_electrolytes"
      - "icu_admission"

  # ── Sepsis ──
  - case_id: case-sepsis
    name: Sepsis - Community Acquired Pneumonia
    patient_id: pat-icu
    symptoms: ["fever", "cough", "dyspnea", "confusion", "oliguria"]
    history:
      - "55-year-old female with 4-day history of productive cough, high fever, breathlessness"
      - "Confusion since yesterday, decreased urine output"
      - "No known comorbidities"
    vitals:
      bp: "85/55"
      heart_rate: 125
      respiratory_rate: 30
      oxygen_saturation: 88
      temperature: 39.5
    exam_findings:
      - "Chest: coarse crepitations right lower zone, bronchial breathing"
      - "CVS: tachycardia, delayed capillary refill >3s"
      - "Neuro: confused, GCS 13"
      - "Skin: warm, flushed"
    investigations:
      wbc: "22,000 with left shift"
      crp: "250"
      lactate: "4.5"
      blood_cultures: "pending"
      cxr: "right lower lobe consolidation"
      procalcitonin: "8.5"
    expected_context: "sepsis_with_pneumonia"
    expected_differentials:
      - "community_acquired_pneumonia"
      - "sepsis"
      - "septic_shock"
      - "pulmonary_embolism"
      - "heart_failure"
    expected_management:
      - "iv_fluids_bolus"
      - "broad_spectrum_antibiotics"
      - "oxygen"
      - "vasopressors"
      - "icu_admission"
      - "source_control"

  # ── TB ──
  - case_id: case-tuberculosis
    name: Pulmonary Tuberculosis
    patient_id: pat-tb
    symptoms: ["chronic_cough", "night_sweats", "weight_loss", "fever", "hemoptysis"]
    history:
      - "34-year-old female with 6-week history of persistent cough, night sweats, weight loss"
      - "Low grade fever, occasional blood-tinged sputum"
      - "Contacts: uncle treated for TB 6 months ago"
    vitals:
      bp: "110/70"
      heart_rate: 95
      respiratory_rate: 22
      oxygen_saturation: 95
      temperature: 37.8
    exam_findings:
      - "General: wasted, pale"
      - "Chest: reduced breath sounds left upper zone, crepitations"
      - "Lymph nodes: no significant lymphadenopathy"
    investigations:
      sputum_smear: "positive (3+)"
      gene_xpert: "positive, rifampicin sensitive"
      cxr: "left upper lobe cavity with infiltrates"
      hiv_test: "negative"
    expected_context: "pulmonary_tuberculosis"
    expected_management:
      - "rifampicin"
      - "isoniazid"
      - "pyrazinamide"
      - "ethambutol"
      - "contact_tracing"
      - "directly_observed_therapy"

  # ── Neonatal Jaundice ──
  - case_id: case-neonatal-jaundice
    name: Neonatal Jaundice
    patient_id: pat-premature-neonate
    symptoms: ["jaundice", "poor_feeding", "lethargy"]
    history:
      - "Preterm neonate (32 weeks), birth weight 1.8kg, day 2 of life"
      - "Mother blood group O Rh negative"
      - "Jaundice noted at 24 hours of life"
    vitals:
      heart_rate: 145
      respiratory_rate: 50
      oxygen_saturation: 96
      temperature: 36.8
    exam_findings:
      - "Skin: yellow discoloration face to chest (Kramer zone 3)"
      - "Neuro: lethargic, poor suck reflex"
      - "Abdomen: soft, mild hepatomegaly"
    investigations:
      total_bilirubin: "280 μmol/L (day 2)"
      direct_bilirubin: "15"
      blood_group: "B Rh positive"
      dat: "negative"
      reticulocyte_count: "6%"
    expected_context: "neonatal_jaundice"
    expected_management:
      - "phototherapy"
      - "exchange_transfusion_assessment"
      - "iv_fluids"
      - "monitor_bilirubin_6_hourly"
      - "investigate_hemolysis"

  # ── Pediatric Malaria ──
  - case_id: case-paediatric-malaria
    name: Severe Pediatric Malaria
    patient_id: pat-paediatric-malaria
    symptoms: ["fever", "vomiting", "lethargy", "seizures"]
    history:
      - "4-year-old male from malaria-endemic area (Siaya), 3 days fever"
      - "Vomiting everything, lethargic, 2 episodes of generalized seizures today"
      - "Not on malaria prophylaxis"
    vitals:
      bp: "85/50"
      heart_rate: 140
      respiratory_rate: 32
      oxygen_saturation: 96
      temperature: 39.8
    exam_findings:
      - "General: lethargic, pale, jaundiced"
      - "Neuro: post-ictal, GCS 11, neck stiffness absent"
      - "Abdomen: tender hepatosplenomegaly"
      - "Skin: no rash"
    investigations:
      malaria_rdt: "positive (Pf)"
      blood_smear: "high parasitemia (10%)"
      hemoglobin: "7.2"
      glucose: "2.8"
      lactate: "3.8"
    expected_context: "severe_malaria"
    expected_management:
      - "parenteral_artesunate"
      - "iv_fluids"
      - "blood_transfusion"
      - "dextrose_for_hypoglycemia"
      - "anticonvulsants"
      - "monitor_parasitemia"
      - "paediatric_high_dependency"

  # ── Obstetric Emergency - Eclampsia ──
  - case_id: case-eclampsia
    name: Eclampsia
    patient_id: pat-pregnant-39w
    symptoms: ["seizures", "headache", "visual_disturbance", "epigastric_pain", "hypertension"]
    history:
      - "31-year-old primigravida at 39 weeks, referred from peripheral clinic"
      - "Headache, blurred vision for 2 days"
      - "Generalized tonic-clonic seizure 30 minutes ago"
      - "Booking BP was normal, recent BP not checked"
    vitals:
      bp: "190/120"
      heart_rate: 105
      respiratory_rate: 24
      oxygen_saturation: 95
      temperature: 37.2
    exam_findings:
      - "CVS: hypertensive"
      - "Neuro: post-ictal, GCS 14, no focal deficits, brisk reflexes, clonus positive"
      - "Abdomen: term uterus, contractions present, fetal heart rate 155"
      - "Edema: bilateral pitting edema legs"
    investigations:
      urine_protein: "3+"
      platelets: "98,000"
      creatinine: "110"
      ast: "85"
      alt: "72"
    expected_context: "eclampsia"
    expected_management:
      - "magnesium_sulfate_loading"
      - "antihypertensives"
      - "emergency_csection"
      - "airway_support"
      - "seizure_precautions"
      - "monitor_fetal_wellbeing"
      - "nicu_standby"

  # ── Burns ──
  - case_id: case-burns
    name: Severe Burns - Thermal Injury
    patient_id: pat-toddler
    symptoms: ["pain", "burn_wounds", "difficulty_breathing"]
    history:
      - "3-year-old female pulled boiling water from stove 1 hour ago"
      - "Burns to chest, right arm, and face"
      - "Crying, in severe pain, hoarse cry noted"
    vitals:
      bp: "80/40"
      heart_rate: 155
      respiratory_rate: 35
      oxygen_saturation: 92
      temperature: 36.5
    exam_findings:
      - "Airway: hoarse voice, stridor, carbonaceous sputum"
      - "Breathing: tachypnea, intercostal recessions"
      - "Burns: mixed partial and full thickness, chest (15%), right arm (10%), face (5%) - TBSA 30%"
      - "Circumferential chest burns with restricted expansion"
    expected_context: "severe_burns_with_inhalation_injury"
    expected_management:
      - "airway_management_intubation"
      - "iv_fluids_resuscitation_parkland"
      - "escharotomy_assessment"
      - "pain_management"
      - "wound_care"
      - "burn_unit_admission"
      - "tetanus_prophylaxis"
