api_tokens:
  # Development API tokens for testing integrations
  - token_id: tok-fhir-dev
    user_id: user-deploy
    token_type: fhir
    description: FHIR R4 API Integration Token
    scopes: ["patient.read", "patient.write", "observation.read", "observation.write", "encounter.read", "encounter.write"]
    expires_at: "2027-01-01T00:00:00Z"
    created_at: "2025-01-01T00:00:00Z"

  - token_id: tok-hl7-dev
    user_id: user-deploy
    token_type: hl7
    description: HL7 v2 Interface Token
    scopes: ["adt.read", "adt.write", "orm.read", "orm.write", "oru.read"]
    expires_at: "2027-01-01T00:00:00Z"
    created_at: "2025-01-01T00:00:00Z"

  - token_id: tok-dicom-dev
    user_id: user-deploy
    token_type: dicom
    description: DICOM Web Gateway Token
    scopes: ["study.read", "study.write", "study.search", "instance.read"]
    expires_at: "2027-01-01T00:00:00Z"
    created_at: "2025-01-01T00:00:00Z"

  - token_id: tok-pacs-dev
