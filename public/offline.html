<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMEXAN — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #071029; color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .card {
      background: #0f1a3a; border-radius: 1rem; padding: 3rem;
      max-width: 480px; text-align: center;
      border: 1px solid rgba(6, 182, 212, 0.2);
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.05);
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #06B6D4; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .status { font-size: 0.875rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📴</div>
    <h1>You're offline</h1>
    <p>AMEXAN is running in offline mode. Any data you enter will be saved locally and automatically synced when connectivity is restored.</p>
    <p class="status">Offline data sync queue active · IndexedDB storage available</p>
  </div>
</body>
</html>
